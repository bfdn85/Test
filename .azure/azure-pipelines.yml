

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

schedules:
  - cron: '0 6 * * 1-5'
    displayName: 'Daily smoke tests weekdays 6am'
    branches:
      include:
        - main
    always: true

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '20.x'

stages:
  - stage: Test
    displayName: 'Playwright E2E Tests'
    jobs:
      - job: PlaywrightTests
        displayName: 'Run Playwright Tests'
        timeoutInMinutes: 30

        steps:
          - task: NodeTool@0
            displayName: 'Use Node $(NODE_VERSION)'
            inputs:
              versionSpec: $(NODE_VERSION)

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npx playwright install --with-deps chromium firefox
            displayName: 'Install Playwright browsers'

          # Runs on push and PR - checkout and inventory
          - script: npx playwright test tests/Regression/
            displayName: 'Run regression tests'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'Schedule'))
            env:
              CI: true

          # Runs on daily schedule - login smoke only
          - script: npx playwright test tests/Smoke/
            displayName: 'Run smoke tests'
            condition: and(succeeded(), eq(variables['Build.Reason'], 'Schedule'))
            env:
              CI: true

          - task: PublishTestResults@2
            displayName: 'Publish test results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/results.xml'
              testRunTitle: 'Playwright E2E Tests'
              failTaskOnFailedTests: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Playwright HTML report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'playwright-report'
              publishLocation: 'pipeline'